<body>
  <section class="login-screen" id="loginScreen">
    <div class="login-shell">
      <div class="login-card">
        <div class="login-card-head">
          <div class="login-mark">RP</div>
          <h2>Iniciar sesión</h2>
          <p class="lead">Acceso seguro al sistema de pedidos, catálogo e inventario.</p>
        </div>
        <form class="login-form" onsubmit="loginSubmit(event)">
          <div class="field">
            <label>Correo electrónico</label>
            <div class="login-input-wrap"><span class="login-input-icon">✉️</span><input class="input" id="loginEmail" type="email" autocomplete="email" placeholder="usuario@empresa.com" required></div>
          </div>
          <div class="field">
            <label>Contraseña</label>
            <div class="login-input-wrap password-field"><span class="login-input-icon">🔒</span><input class="input" id="loginPassword" type="password" autocomplete="current-password" placeholder="Contraseña" required><button class="password-toggle" id="loginPasswordToggle" type="button" onclick="toggleLoginPassword()" aria-label="Mostrar contraseña">👁️ Ver</button></div>
          </div>
          <button class="btn btn-primary login-btn" id="loginButton" type="submit">Ingresar al sistema</button>
          <div class="login-message" id="loginMessage"></div>
        </form>
        <div class="login-note">Si el usuario existe en Authentication pero no está registrado en la base del sistema, no podrá ingresar.</div>
      </div>
    </div>
  </section>
  <div class="mobile-overlay" id="overlay" onclick="toggleMenu(false)"></div>
  <div class="app auth-hidden" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo">RP</div>
        <div class="brand-text">
          <h1 id="brandName">Repuestos Pro</h1>
          <span>Pedidos · inventario · rutas</span>
        </div>
      </div>
      <nav class="menu" id="menu"></nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="top-left">
          <button class="hamb" onclick="toggleMenu(true)">☰</button>
          <button class="desktop-menu-toggle no-print" id="desktopSidebarToggle" onclick="toggleSidebarDesktop()" title="Contraer menú" aria-label="Contraer menú">☰</button>
          <div>
            <h1 class="page-title" id="pageTitle">Inicio</h1>
            <div class="kpi-line" id="pageSubtitle"></div>
          </div>
        </div>
        <div class="top-actions no-print">
          <span class="pill" id="syncStatus">● Local</span>
          <span class="pill" id="userSession">Usuario</span>
          <button class="btn btn-secondary btn-sm" onclick="logout()">Salir</button>
        </div>
      </header>
      <section class="view" id="view"></section>
    </main>
  </div>

  <datalist id="productList"></datalist>
  <datalist id="clientList"></datalist>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAnalytics, isSupported } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      collection,
      getDocs,
      writeBatch,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import {
      getStorage,
      ref as storageRef,
      uploadBytes,
      getDownloadURL
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
    import {
      getAuth,
      setPersistence,
      browserLocalPersistence,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCgLyrgqEbp9dKrC6DvZyQJN2lzX3Jn6t4",
      authDomain: "repuestos-bb42c.firebaseapp.com",
      projectId: "repuestos-bb42c",
      storageBucket: "repuestos-bb42c.firebasestorage.app",
      messagingSenderId: "573073652417",
      appId: "1:573073652417:web:e53f5f2680603c1110b240",
      measurementId: "G-FKT5LYMX34"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);
    const auth = getAuth(app);
    setPersistence(auth, browserLocalPersistence).catch(() => {});
    const APP_DOC = "repuestos_principal";
    const DATA_COLLECTIONS = ["clients", "products", "orders", "quotes", "returns", "routes", "movements", "users"];

    isSupported().then((ok) => {
      if (ok) getAnalytics(app);
    }).catch(() => {});

    const appRef = doc(db, "apps", APP_DOC);
    const colRef = (name) => collection(db, "apps", APP_DOC, name);

    function cleanData(value){
      return JSON.parse(JSON.stringify(value ?? {}));
    }

    function sortCloudList(name, list){
      const arr = Array.isArray(list) ? list : [];
      if(["orders", "quotes", "returns", "movements"].includes(name)){
        return arr.sort((a,b)=>String(b.createdAt || b.date || '').localeCompare(String(a.createdAt || a.date || '')));
      }
      if(name === "products"){
        return arr.sort((a,b)=>String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
      }
      return arr;
    }

    async function commitInChunks(items, writer){
      let batch = writeBatch(db);
      let count = 0;
      for (const item of items){
        writer(batch, item);
        count++;
        if(count >= 400){
          await batch.commit();
          batch = writeBatch(db);
          count = 0;
        }
      }
      if(count > 0) await batch.commit();
    }

    window.repuestosFirebase = {
      ready: true,
      projectId: firebaseConfig.projectId,
      login(email, password){
        return signInWithEmailAndPassword(auth, email, password);
      },
      logout(){
        return signOut(auth);
      },
      currentUser(){
        return auth.currentUser;
      },
      async pull(){
        const appSnap = await getDoc(appRef);
        const cloud = appSnap.exists() ? appSnap.data() : {};
        const data = {
          settings: cloud.settings || null,
          currentRole: cloud.currentRole || "Admin"
        };
        let totalDocs = 0;
        for(const name of DATA_COLLECTIONS){
          const snap = await getDocs(colRef(name));
          const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));

    function miniOrders(list){if(!list.length)return `<div class="empty">No hay pedidos registrados.</div>`;return `<div class="table-wrap"><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Entrega</th><th>Total</th><th>Estado</th></tr></thead><tbody>${list.map(o=>`<tr><td><b>${o.number}</b><br><small>${o.date}</small></td><td>${esc(o.client?.name||'')}</td><td>${esc(o.estimatedDelivery||'Sin fecha')}</td><td><b>${money(o.total)}</b></td><td>${statusBadge(o.status)}</td></tr>`).join('')}</tbody></table></div>`}

          <div class="section-title"><div><h2>Agregar productos</h2><p>El sistema valida stock antes de guardar.</p></div></div>
          <div class="form-grid">
            <div class="field full"><label>Buscar producto</label><input class="input" list="productList" id="orderProductSearch" placeholder="Código, referencia o nombre del repuesto"></div>

          <div class="field"><label>Domicilio / envío</label><input type="number" min="0" class="input" id="orderShipping" value="0" oninput="render()"></div>

    function fillClient(prefix){
      const c=findClient(document.getElementById(prefix+'ClientSearch')?.value); if(!c)return;
      document.getElementById(prefix+'ClientName').value=c.name||''; document.getElementById(prefix+'ClientDoc').value=c.document||''; document.getElementById(prefix+'ClientPhone').value=c.phone||''; document.getElementById(prefix+'ClientCity').value=c.city||''; document.getElementById(prefix+'ClientAddress').value=c.address||'';
      if(prefix==='catalog'){Object.assign(ui.catalogForm,{clientName:c.name||'',clientDoc:c.document||'',clientPhone:c.phone||'',clientCity:c.city||'',clientAddress:c.address||''});}
    }
    function readClient(prefix){return {name:val(prefix+'ClientName'),document:val(prefix+'ClientDoc'),phone:val(prefix+'ClientPhone'),city:val(prefix+'ClientCity'),address:val(prefix+'ClientAddress')}}
    function val(id){return document.getElementById(id)?.value?.trim()||''}
    function saveOrderForm(printAfter=false){
      if(!ui.orderCart.length){alert('Debes agregar al menos un producto al pedido.');return;}
      const client=readClient('order'); if(!client.name){alert('Ingresa el nombre del cliente.');return;}
      const order=createOrder({source:'Ingresar pedido',date:val('orderDate'),estimatedDelivery:val('orderDelivery'),deliveryTime:val('orderDeliveryTime'),client,items:ui.orderCart,discount:num(val('orderDiscount')),shipping:num(val('orderShipping')),paymentMethod:val('orderPayment'),deliveryType:val('orderDeliveryType'),responsible:val('orderResponsible'),observations:val('orderObs'),status:'Pendiente'});
      if(order){ui.orderCart=[]; alert('Pedido guardado correctamente: '+order.number); if(printAfter) printOrder(order.id); go('orders');}
    }

    function renderOrders(){
      const q=(val('orderSearch')||'').toLowerCase();
      const status=val('orderStatusFilter');
      let list=DB.orders.filter(o=>!o.deleted);
      if(q) list=list.filter(o=>[o.number,o.client?.name,o.client?.phone,o.status,o.estimatedDelivery].some(x=>String(x||'').toLowerCase().includes(q)));
      if(status) list=list.filter(o=>o.status===status);
      return `<div class="card"><div class="section-title"><div><h2>Pedidos</h2><p>Consulta, cambia estado, imprime, envía por WhatsApp o cancela.</p></div><button class="btn btn-primary" onclick="go('orderNew')">Nuevo pedido</button></div>
        <div class="form-grid"><div class="field"><label>Buscar</label><input class="input" id="orderSearch" placeholder="Pedido, cliente, teléfono" oninput="renderOrdersOnly()" value="${esc(val('orderSearch'))}"></div><div class="field"><label>Estado</label><select class="select" id="orderStatusFilter" onchange="renderOrdersOnly()"><option value="">Todos</option>${['Pendiente','Confirmado','En preparación','Listo para entrega','En ruta','Entregado','Cancelado'].map(s=>`<option ${status===s?'selected':''}>${s}</option>`).join('')}</select></div></div>
        <div style="margin-top:14px">${ordersTable(list)}</div></div>`;
    }
    function renderOrdersOnly(){document.getElementById('view').innerHTML=renderOrders();}
    function ordersTable(list){
      if(!list.length)return `<div class="empty">No hay pedidos para mostrar.</div>`;
      return `<div class="table-wrap"><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Entrega</th><th>Productos</th><th>Total</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${list.map(o=>`<tr><td><b>${o.number}</b><br><small>${o.date}</small></td><td><b>${esc(o.client?.name||'')}</b><br><small>${esc(o.client?.phone||'')}</small></td><td>${esc(o.estimatedDelivery||'Sin fecha')}<br><small>${esc(o.deliveryTime||'')}</small></td><td><div class="actions">${o.items.slice(0,3).map(i=>productImage(i,'product-thumb sm')).join('')}<span class="badge gray">${o.items.length} item(s)</span></div><small>${esc(o.deliveryType)}</small></td><td><b>${money(o.total)}</b></td><td><select class="select" onchange="setOrderStatus('${o.id}',this.value)">${['Pendiente','Confirmado','En preparación','Listo para entrega','En ruta','Entregado','Cancelado'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td><div class="actions"><button class="btn btn-secondary btn-sm" onclick="viewOrder('${o.id}')">Ver</button><button class="btn btn-outline btn-sm" onclick="printOrder('${o.id}')">Imprimir</button><button class="btn btn-success btn-sm" onclick="whatsappOrder('${o.id}')">WhatsApp</button><button class="btn btn-warning btn-sm" onclick="cancelOrder('${o.id}')">Cancelar</button>${isAdmin()?`<button class="btn btn-danger btn-sm" onclick="deleteOrder('${o.id}')">Eliminar</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`;
    }
    function renderOrderDetail(o){
      return `<div class="card"><div class="section-title"><div><h2>Pedido ${o.number}</h2><p>Fecha: ${o.date} · Entrega estimada: ${o.estimatedDelivery||'Sin fecha'}</p></div>${statusBadge(o.status)}</div>
        <div class="grid grid-2"><div><b>Cliente:</b> ${esc(o.client?.name||'')}<br><b>Teléfono:</b> ${esc(o.client?.phone||'')}<br><b>Dirección:</b> ${esc(o.client?.address||'')} ${esc(o.client?.city||'')}</div><div><b>Pago:</b> ${esc(o.paymentMethod)}<br><b>Entrega:</b> ${esc(o.deliveryType)}<br><b>Responsable:</b> ${esc(o.responsible||'')}</div></div>
        <div style="margin-top:14px" class="table-wrap"><table><thead><tr><th>Producto</th><th>Cant.</th><th>Precio</th><th>Desc.</th><th>Subtotal</th></tr></thead><tbody>${o.items.map(i=>`<tr><td>${productCell(i)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.discount)}</td><td><b>${money(i.subtotal)}</b></td></tr>`).join('')}</tbody></table></div>
        <div style="margin-top:14px">${summaryHtml(o)}</div><p><b>Observaciones:</b> ${esc(o.observations||'Sin observaciones')}</p></div>`;
    }
    function summaryHtml(o){return `<div class="summary-box"><div class="summary-row"><span>Subtotal</span><b>${money(o.subtotal)}</b></div><div class="summary-row"><span>Descuento</span><b>${money(o.discount)}</b></div><div class="summary-row"><span>Envío</span><b>${money(o.shipping)}</b></div><div class="summary-row total"><span>Total</span><span>${money(o.total)}</span></div></div>`}
    function viewOrder(id){const o=DB.orders.find(x=>x.id===id); if(!o)return; document.getElementById('view').innerHTML=`<div class="actions no-print" style="margin-bottom:14px"><button class="btn btn-secondary" onclick="render()">← Volver</button><button class="btn btn-outline" onclick="printOrder('${id}')">Imprimir</button><button class="btn btn-success" onclick="whatsappOrder('${id}')">WhatsApp</button></div>${renderOrderDetail(o)}`;}
    function printOrder(id){const o=DB.orders.find(x=>x.id===id); if(!o)return; const old=document.body.innerHTML; document.body.innerHTML=`<main style="font-family:Arial;padding:24px">${renderOrderDetail(o)}</main>`; window.print(); document.body.innerHTML=old; location.reload();}
    function whatsappOrder(id){const o=DB.orders.find(x=>x.id===id); if(!o)return; const items=o.items.map(i=>`• ${i.name} x${i.qty} = ${money(i.subtotal)}`).join('%0A'); const msg=`Pedido ${o.number}%0ACliente: ${encodeURIComponent(o.client?.name||'')}%0AEntrega estimada: ${o.estimatedDelivery||'Sin fecha'}%0A${items}%0ATotal: ${money(o.total)}`; window.open(`https://wa.me/${String(o.client?.phone||'').replace(/\D/g,'')}?text=${msg}`,'_blank');}
    function setOrderStatus(id,status){const o=DB.orders.find(x=>x.id===id); if(!o)return; if(status==='Cancelado' && o.status!=='Cancelado'){cancelOrder(id,true);return;} o.status=status; saveDB(); render();}
    function cancelOrder(id,silent=false){const o=DB.orders.find(x=>x.id===id); if(!o)return; if(!silent && !confirm('¿Cancelar este pedido? El stock se devolverá si ya fue descontado.'))return; if(!o.stockRestored){o.items.forEach(i=>moveStock(i.productId,Number(i.qty),'Entrada por cancelación',o.number,'Pedido cancelado'));o.stockRestored=true;} o.status='Cancelado'; saveDB(); if(!silent)alert('Pedido cancelado y stock ajustado.'); render();}
    function deleteOrder(id){if(!isAdmin()){alert('Solo administrador.');return;} const o=DB.orders.find(x=>x.id===id); if(!o)return; if(!confirm('¿Eliminar pedido? Quedará oculto y se guardará historial.'))return; if(!o.stockRestored){o.items.forEach(i=>moveStock(i.productId,Number(i.qty),'Entrada por eliminación',o.number,'Pedido eliminado'));o.stockRestored=true;} o.deleted=true;o.deletedAt=new Date().toISOString();o.deletedBy=role();saveDB();render();}
    function restoreDeletedOrder(id){const o=DB.orders.find(x=>x.id===id); if(!o)return; const errors=validateStock(o.items); if(errors.length){alert('No se puede restaurar porque no hay stock suficiente para descontar:\n'+errors.join('\n'));return;} o.items.forEach(i=>moveStock(i.productId,-Number(i.qty),'Salida por restauración',o.number,'Pedido restaurado')); o.deleted=false;o.stockRestored=false;o.status='Pendiente';saveDB();render();}

    function renderCatalog(){
      const cats=['Todos',...new Set(activeProducts().map(p=>p.category||'Otros'))];
      let list=activeProducts(); if(ui.catalogFilter!=='Todos') list=list.filter(p=>p.category===ui.catalogFilter); if(ui.searchCatalog) {const q=ui.searchCatalog.toLowerCase(); list=list.filter(p=>[p.name,p.code,p.ref,p.brand].some(x=>String(x||'').toLowerCase().includes(q)));}

      return `<div class="grid catalog-layout">
        <div>
          <div class="card"><div class="section-title"><div><h2>Catálogo de productos</h2><p>Busca el repuesto, agrégalo y completa el pedido en el panel derecho.</p></div><span class="badge info">${cartCount} producto(s)</span></div>
          <div class="form-grid"><div class="field"><label>Buscar producto</label><input class="input" value="${esc(ui.searchCatalog)}" oninput="ui.searchCatalog=this.value;render()" placeholder="Código, referencia, nombre o marca"></div><div class="field"><label>Categoría</label><select class="select" onchange="ui.catalogFilter=this.value;render()">${cats.map(c=>`<option ${ui.catalogFilter===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div></div></div>
          <div class="catalog-products-grid" style="margin-top:16px">${list.length?list.map(p=>productCard(p)).join(''):`<div class="empty">No hay productos disponibles.</div>`}</div>
        </div>
        <div class="card cart-sticky no-print catalog-cart-card"><div class="section-title"><div><h2>Pedido actual</h2><p>Productos, cliente, entrega y total.</p></div><button class="btn btn-secondary btn-sm" onclick="clearCart('catalog')">Limpiar</button></div>${catalogCartPanel()}</div>
      </div>
      <div class="mobile-cart-bar" onclick="document.getElementById('catalogCheckout')?.scrollIntoView({behavior:'smooth'})"><span>🛒 ${cartCount} producto(s)</span><span>${money(total)} · Finalizar</span></div>`;
    }
    function productCard(p){return `<div class="product-card">${productImage(p,'product-hero')}<div class="product-top"><div><div class="product-name">${esc(p.name)}</div><div class="product-ref">${esc(p.code)} · Ref ${esc(p.ref)}</div></div>${stockBadge(p)}</div><div class="product-ref">Marca: ${esc(p.brand||'')} · ${esc(p.category||'')}</div><div class="price">${money(p.price)}</div><div class="product-ref">Stock: <b>${p.stock}</b> · Ubicación: ${esc(p.location||'')}</div><button class="btn btn-primary" onclick="addCatalogProduct('${p.id}')" ${Number(p.stock)<=0?'disabled':''}>Agregar al pedido</button></div>`}
    function addCatalogProduct(id){const p=productById(id); if(!p)return; const existing=ui.catalogCart.find(i=>i.productId===id); const current=existing?existing.qty:0; if(Number(p.stock)<current+1){alert('No hay más stock disponible.');return;} if(existing)existing.qty++; else ui.catalogCart.push({productId:p.id,code:p.code,ref:p.ref,name:p.name,brand:p.brand,category:p.category,image:p.image||'',qty:1,price:Number(p.price),discount:0}); render();}

      const deliveryTypes=['Recoge en tienda','Domicilio','Ruta'];
      const payments=['Efectivo','Transferencia','Crédito','Contraentrega'];
      return `<div id="catalogCheckout">
        <div class="catalog-block"><h3>Productos agregados</h3>${catalogCartList()}</div>
        <div class="catalog-block"><h3>Cliente y entrega</h3>
          <div class="form-grid catalog-checkout-grid">
            <div class="field full"><label>Buscar cliente</label><input class="input" list="clientList" id="catalogClientSearch" value="${esc(f.clientSearch)}" oninput="catalogFormValue('clientSearch',this.value);fillClient('catalog')"></div>
            <div class="field full"><label>Nombre cliente</label><input class="input" id="catalogClientName" value="${esc(f.clientName)}" oninput="catalogFormValue('clientName',this.value)"></div>
            <div class="field"><label>Documento / NIT</label><input class="input" id="catalogClientDoc" value="${esc(f.clientDoc)}" oninput="catalogFormValue('clientDoc',this.value)"></div>

            <div class="field full"><label>Dirección</label><input class="input" id="catalogClientAddress" value="${esc(f.clientAddress)}" oninput="catalogFormValue('clientAddress',this.value)"></div>
            <div class="field"><label>Ciudad</label><input class="input" id="catalogClientCity" value="${esc(f.clientCity)}" oninput="catalogFormValue('clientCity',this.value)"></div>

    function catalogCartList(){
      const cart=ui.catalogCart; if(!cart.length) return `<div class="empty">Aún no has agregado productos.</div>`;
      return `<div class="catalog-cart-list">${cart.map((i,idx)=>{const p=productById(i.productId)||{};const sub=Number(i.qty)*Number(i.price)-Number(i.discount||0);return `<div class="catalog-cart-item"><div class="catalog-cart-head"><div class="product-cell">${productImage(i,'product-thumb sm')}<div class="product-cell-info"><div class="catalog-cart-title">${esc(i.name)}</div><div class="catalog-cart-meta">${esc(i.code)} · Ref ${esc(i.ref)} · Stock ${p.stock??''}</div></div></div><button class="btn btn-danger btn-sm" onclick="removeCartItem('catalog',${idx})">Quitar</button></div><div class="catalog-cart-foot"><div class="qty-control"><button onclick="changeCartQty('catalog',${idx},-1)">−</button><input class="input" value="${i.qty}" readonly><button onclick="changeCartQty('catalog',${idx},1)">+</button></div><div><div class="catalog-cart-meta">${money(i.price)} c/u</div><div class="catalog-cart-total">${money(sub)}</div></div></div></div>`}).join('')}</div>`;

    function saveCatalogOrder(){
      if(!ui.catalogCart.length){alert('Agrega productos al pedido.');return;} const client=readClient('catalog'); if(!client.name){alert('Ingresa el nombre del cliente.');return;}
      const f=ui.catalogForm;

    function renderQuoteNew(){
      return `<div class="grid grid-2"><div class="card"><div class="section-title"><div><h2>Datos de cotización</h2><p>La cotización no descuenta inventario.</p></div><span class="badge info">${quoteNumber()}</span></div><div class="form-grid"><div class="field full"><label>Buscar cliente</label><input class="input" list="clientList" id="quoteClientSearch" oninput="fillClient('quote')"></div><div class="field"><label>Nombre cliente</label><input class="input" id="quoteClientName"></div><div class="field"><label>Documento / NIT</label><input class="input" id="quoteClientDoc"></div><div class="field"><label>Teléfono / WhatsApp</label><input class="input" id="quoteClientPhone"></div><div class="field"><label>Ciudad</label><input class="input" id="quoteClientCity"></div><div class="field full"><label>Dirección</label><input class="input" id="quoteClientAddress"></div><div class="field"><label>Fecha</label><input type="date" class="input" id="quoteDate" value="${today()}"></div><div class="field"><label>Validez</label><select class="select" id="quoteValidity"><option>8 días</option><option>15 días</option><option>30 días</option></select></div></div></div>
      <div class="card"><div class="section-title"><div><h2>Agregar productos</h2><p>Muestra disponibilidad, pero no descuenta stock.</p></div></div><div class="form-grid"><div class="field full"><label>Buscar producto</label><input class="input" list="productList" id="quoteProductSearch"></div><div class="field"><label>Cantidad</label><input type="number" min="1" class="input" id="quoteQty" value="1"></div><div class="field"><label>Descuento</label><input type="number" class="input" id="quoteItemDiscount" value="0"></div><div class="field full"><button class="btn btn-primary" onclick="addToCart('quote')">+ Agregar a cotización</button></div></div></div></div>

    function saveQuoteForm(){
      if(!ui.quoteCart.length){alert('Debes agregar al menos un producto.');return;} const client=readClient('quote'); if(!client.name){alert('Ingresa cliente.');return;}
      const items=ui.quoteCart.map(i=>({...i,subtotal:Number(i.qty)*Number(i.price)-Number(i.discount||0)})); const t=totals(items,num(val('quoteDiscount')),num(val('quoteShipping'))); const clientId=addClientIfNeeded(client);

    function renderQuotes(){const list=DB.quotes.filter(q=>!q.deleted);return `<div class="card"><div class="section-title"><div><h2>Cotizaciones</h2><p>Consulta, imprime o convierte en pedido.</p></div><button class="btn btn-primary" onclick="go('quoteNew')">Nueva cotización</button></div>${quotesTable(list)}</div>`}
    function quotesTable(list){if(!list.length)return `<div class="empty">No hay cotizaciones.</div>`;return `<div class="table-wrap"><table><thead><tr><th>Cotización</th><th>Cliente</th><th>Validez</th><th>Productos</th><th>Total</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${list.map(q=>`<tr><td><b>${q.number}</b><br><small>${q.date}</small></td><td><b>${esc(q.client?.name||'')}</b><br><small>${esc(q.client?.phone||'')}</small></td><td>${esc(q.validity||'')}</td><td><div class="actions">${q.items.slice(0,3).map(i=>productImage(i,'product-thumb sm')).join('')}<span class="badge gray">${q.items.length} item(s)</span></div></td><td><b>${money(q.total)}</b></td><td>${statusBadge(q.status)}</td><td><div class="actions"><button class="btn btn-secondary btn-sm" onclick="viewQuote('${q.id}')">Ver</button><button class="btn btn-success btn-sm" onclick="convertQuote('${q.id}')">Convertir en pedido</button>${isAdmin()?`<button class="btn btn-danger btn-sm" onclick="deleteQuote('${q.id}')">Eliminar</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`}
    function viewQuote(id){const q=DB.quotes.find(x=>x.id===id); if(!q)return; document.getElementById('view').innerHTML=`<div class="actions" style="margin-bottom:14px"><button class="btn btn-secondary" onclick="render()">← Volver</button><button class="btn btn-success" onclick="convertQuote('${q.id}')">Convertir en pedido</button></div><div class="card"><div class="section-title"><div><h2>Cotización ${q.number}</h2><p>${q.date} · Validez ${esc(q.validity||'')}</p></div>${statusBadge(q.status)}</div><p><b>Cliente:</b> ${esc(q.client?.name||'')} · ${esc(q.client?.phone||'')}</p><div class="table-wrap"><table><thead><tr><th>Producto</th><th>Cant.</th><th>Precio</th><th>Subtotal</th></tr></thead><tbody>${q.items.map(i=>`<tr><td>${productCell(i)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.subtotal)}</td></tr>`).join('')}</tbody></table></div><div style="margin-top:14px">${summaryHtml(q)}</div></div>`;}
    function convertQuote(id){const q=DB.quotes.find(x=>x.id===id); if(!q)return; if(q.status==='Convertida en pedido'){alert('Esta cotización ya fue convertida.');return;} const delivery=prompt('Fecha estimada de entrega (AAAA-MM-DD):',today()); if(!delivery)return; const order=createOrder({source:'Cotización '+q.number,date:today(),estimatedDelivery:delivery,client:q.client,items:q.items,discount:q.discount,shipping:q.shipping,paymentMethod:'Por definir',deliveryType:'Ruta',observations:'Creado desde cotización '+q.number,status:'Pendiente'}); if(order){q.status='Convertida en pedido';q.orderId=order.id;saveDB();alert('Cotización convertida en pedido '+order.number);go('orders');}}
    function deleteQuote(id){if(!isAdmin()){alert('Solo administrador.');return;} const q=DB.quotes.find(x=>x.id===id); if(!q)return; if(!confirm('¿Eliminar cotización?'))return; q.deleted=true;q.deletedAt=new Date().toISOString();q.deletedBy=role();saveDB();render();}
    function restoreDeletedQuote(id){const q=DB.quotes.find(x=>x.id===id); if(!q)return; q.deleted=false;saveDB();render();}

    function renderReturnNew(){
      const orders=DB.orders.filter(o=>!o.deleted && o.status!=='Cancelado');
      const selected=val('returnOrder')||orders[0]?.id||''; const order=DB.orders.find(o=>o.id===selected);
      return `<div class="card"><div class="section-title"><div><h2>Ingresar devolución</h2><p>Si el producto vuelve en buen estado, se suma de nuevo al inventario.</p></div><span class="badge info">${returnNumber()}</span></div><div class="field"><label>Pedido relacionado</label><select class="select" id="returnOrder" onchange="renderReturnNewOnly()">${orders.map(o=>`<option value="${o.id}" ${selected===o.id?'selected':''}>${o.number} · ${esc(o.client?.name||'')} · ${money(o.total)}</option>`).join('')}</select></div></div>
      ${order?`<div class="card" style="margin-top:16px"><div class="section-title"><div><h2>Productos del pedido</h2><p>Ingresa la cantidad devuelta por producto.</p></div></div><div class="table-wrap"><table><thead><tr><th>Producto</th><th>Comprado</th><th>Devuelve</th><th>Estado</th><th>¿Vuelve a inventario?</th></tr></thead><tbody>${order.items.map((i,idx)=>`<tr><td>${productCell(i, esc(i.code||''))}</td><td>${i.qty}</td><td><input type="number" min="0" max="${i.qty}" class="input" id="retQty${idx}" value="0"></td><td><select class="select" id="retCondition${idx}"><option>Buen estado</option><option>Dañado</option><option>En revisión</option></select></td><td><select class="select" id="retRestock${idx}"><option value="si">Sí</option><option value="no">No</option></select></td></tr>`).join('')}</tbody></table></div><div class="form-grid" style="margin-top:14px"><div class="field"><label>Motivo</label><select class="select" id="returnReason"><option>Producto equivocado</option><option>Producto defectuoso</option><option>Cliente no lo necesitó</option><option>Error en pedido</option><option>Garantía</option><option>Otro</option></select></div><div class="field"><label>Responsable</label><input class="input" id="returnResponsible" value="${esc(role())}"></div><div class="field full"><label>Observaciones</label><textarea class="textarea" id="returnObs"></textarea></div><div class="field full"><button class="btn btn-primary" onclick="saveReturn('${order.id}')">Guardar Devolución</button></div></div></div>`:`<div class="empty" style="margin-top:16px">No hay pedidos disponibles para devolución.</div>`}`;
    }
    function renderReturnNewOnly(){document.getElementById('view').innerHTML=renderReturnNew();}
    function saveReturn(orderId){const o=DB.orders.find(x=>x.id===orderId); if(!o)return; const items=[]; o.items.forEach((i,idx)=>{const qty=num(val('retQty'+idx)); if(qty>0){if(qty>Number(i.qty)){alert('La cantidad devuelta no puede superar la comprada.');return;} items.push({...i,qty,condition:val('retCondition'+idx),restock:val('retRestock'+idx)==='si'});}}); if(!items.length){alert('Ingresa al menos una cantidad devuelta.');return;} const ret={id:uid('ret'),number:returnNumber(),date:today(),createdAt:new Date().toISOString(),orderId:o.id,orderNumber:o.number,client:o.client,reason:val('returnReason'),responsible:val('returnResponsible'),observations:val('returnObs'),items,status:'Recibida'}; items.forEach(i=>{if(i.restock)moveStock(i.productId,Number(i.qty),'Entrada por devolución',ret.number,`Devolución del pedido ${o.number}`)}); DB.returns.unshift(ret); saveDB(); alert('Devolución registrada.'); go('returns');}
    function renderReturns(){const list=DB.returns; if(!list.length)return `<div class="card"><div class="section-title"><div><h2>Devoluciones</h2><p>Historial de devoluciones.</p></div><button class="btn btn-primary" onclick="go('returnNew')">Nueva devolución</button></div><div class="empty">No hay devoluciones registradas.</div></div>`;return `<div class="card"><div class="section-title"><div><h2>Devoluciones</h2><p>Historial y estado de cada devolución.</p></div><button class="btn btn-primary" onclick="go('returnNew')">Nueva devolución</button></div><div class="table-wrap"><table><thead><tr><th>Devolución</th><th>Pedido</th><th>Cliente</th><th>Motivo</th><th>Productos</th><th>Estado</th></tr></thead><tbody>${list.map(r=>`<tr><td><b>${r.number}</b><br><small>${r.date}</small></td><td>${r.orderNumber}</td><td>${esc(r.client?.name||'')}</td><td>${esc(r.reason)}</td><td><div class="actions">${r.items.slice(0,3).map(i=>productImage(i,'product-thumb sm')).join('')}<span class="badge gray">${r.items.length} item(s)</span></div></td><td>${statusBadge(r.status)}</td></tr>`).join('')}</tbody></table></div></div>`;}

    function renderInventory(){
      const list=activeProducts(); const value=list.reduce((a,p)=>a+Number(p.stock)*Number(p.cost||0),0); const saleValue=list.reduce((a,p)=>a+Number(p.stock)*Number(p.price||0),0);
      return `<div class="grid grid-3"><div class="card stat"><div><div class="label">Productos activos</div><div class="value">${list.length}</div></div><div class="icon">🏷️</div></div><div class="card stat"><div><div class="label">Costo inventario</div><div class="value">${money(value)}</div></div><div class="icon">📦</div></div><div class="card stat"><div><div class="label">Valor venta</div><div class="value">${money(saleValue)}</div></div><div class="icon">💰</div></div></div>
      <div class="card" style="margin-top:16px"><div class="section-title"><div><h2>Inventario</h2><p>Stock real descontado automáticamente con cada pedido.</p></div><button class="btn btn-primary" onclick="go('productNew')">Ingresar producto</button></div>${inventoryTable(list)}</div>`;
    }
    function inventoryTable(list){if(!list.length)return `<div class="empty">No hay productos.</div>`;return `<div class="table-wrap"><table><thead><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Mín.</th><th>Ubicación</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${list.map(p=>`<tr><td>${productCell(p)}</td><td>${esc(p.category||'')}</td><td>${money(p.price)}</td><td><b>${p.stock}</b></td><td>${p.minStock}</td><td>${esc(p.location||'')}</td><td>${stockBadge(p)}</td><td><div class="actions"><button class="btn btn-secondary btn-sm" onclick="editProduct('${p.id}')">Editar</button><button class="btn btn-warning btn-sm" onclick="adjustStock('${p.id}')">Ajustar stock</button></div></td></tr>`).join('')}</tbody></table></div>`}
    function renderProductNew(){const p=ui.productEditingId?productById(ui.productEditingId):null;return `<div class="card"><div class="section-title"><div><h2>${p?'Editar producto':'Ingresar producto'}</h2><p>Registra repuestos de moto, carro, maquinaria u otros. La imagen se verá en catálogo, pedidos, cotizaciones, devoluciones e inventario.</p></div>${p?`<button class="btn btn-secondary btn-sm" onclick="ui.productEditingId=null;render()">Nuevo</button>`:''}</div><div class="form-grid"><div class="field"><label>Código interno</label><input class="input" id="prodCode" value="${esc(p?.code||'')}"></div><div class="field"><label>Referencia</label><input class="input" id="prodRef" value="${esc(p?.ref||'')}"></div><div class="field full"><label>Nombre del repuesto</label><input class="input" id="prodName" value="${esc(p?.name||'')}" oninput="updateProductPreview(val('prodImage'))"></div><div class="field"><label>Marca</label><input class="input" id="prodBrand" value="${esc(p?.brand||'')}"></div><div class="field"><label>Categoría</label><select class="select" id="prodCategory">${['Moto','Carro','Camión','Maquinaria','Otros'].map(c=>`<option ${p?.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Unidad</label><input class="input" id="prodUnit" value="${esc(p?.unit||'Unidad')}"></div><div class="field"><label>Ubicación bodega</label><input class="input" id="prodLocation" value="${esc(p?.location||'')}"></div><div class="field"><label>Precio compra</label><input type="number" class="input" id="prodCost" value="${esc(p?.cost||0)}"></div><div class="field"><label>Precio venta</label><input type="number" class="input" id="prodPrice" value="${esc(p?.price||0)}"></div><div class="field"><label>Stock actual</label><input type="number" class="input" id="prodStock" value="${esc(p?.stock||0)}"></div><div class="field"><label>Stock mínimo</label><input type="number" class="input" id="prodMin" value="${esc(p?.minStock||0)}"></div><div class="field full"><label>Imagen del producto</label><input class="input" id="prodImage" value="${esc(p?.image||'')}" placeholder="Pega una URL de imagen o carga un archivo" oninput="updateProductPreview(this.value)"><div class="actions" style="margin-top:8px"><label class="btn btn-secondary btn-sm">Cargar imagen desde archivo<input type="file" accept="image/*" onchange="loadProductImageFile(event)" style="display:none"></label><button type="button" class="btn btn-danger btn-sm" onclick="document.getElementById('prodImage').value='';updateProductPreview('')">Quitar imagen</button></div></div><div class="field full"><div class="product-preview-wrap"><div id="prodImagePreview">${productImage(p||{name:'Producto',image:''},'product-preview-img')}</div><div class="product-preview-note"><b>Vista previa</b><br>Para mejor rendimiento usa imágenes livianas. Si Firebase Storage está activo, las imágenes se suben y se guardan como URL; si no, se usa respaldo local base64.</div></div></div><div class="field full"><button class="btn btn-primary" onclick="saveProduct()">${p?'Guardar cambios':'Guardar producto'}</button></div></div></div>`}
    function updateProductPreview(src){const box=document.getElementById('prodImagePreview'); if(!box)return; box.innerHTML=productImage({name:val('prodName')||'Producto',image:src||''},'product-preview-img');}
    async function loadProductImageFile(ev){const file=ev.target.files?.[0]; if(!file)return; const input=document.getElementById('prodImage'); if(window.repuestosFirebase?.uploadImage&&navigator.onLine){try{if(input)input.value='Subiendo imagen a Firebase Storage...'; updateProductPreview(''); const url=await window.repuestosFirebase.uploadImage(file); if(input)input.value=url; updateProductPreview(url); return;}catch(e){console.error('No se pudo subir a Storage',e); alert('No se pudo subir la imagen a Firebase Storage. Se intentará guardar localmente si es liviana. Detalle: '+(e.message||e));}} if(file.size>800000){alert('La imagen es muy pesada para guardarla localmente. Usa una imagen menor a 800 KB o revisa Firebase Storage.');ev.target.value=''; if(input)input.value=''; updateProductPreview(''); return;} const reader=new FileReader(); reader.onload=()=>{if(input) input.value=reader.result; updateProductPreview(reader.result);}; reader.readAsDataURL(file);}
    function saveProduct(){const data={code:val('prodCode'),ref:val('prodRef'),name:val('prodName'),brand:val('prodBrand'),category:val('prodCategory'),unit:val('prodUnit'),location:val('prodLocation'),cost:num(val('prodCost')),price:num(val('prodPrice')),stock:num(val('prodStock')),minStock:num(val('prodMin')),image:val('prodImage'),active:true}; if(!data.code||!data.name){alert('Código y nombre son obligatorios.');return;} if(ui.productEditingId){const p=productById(ui.productEditingId); const oldStock=Number(p.stock); Object.assign(p,data); if(oldStock!==data.stock){DB.movements.unshift({id:uid('mov'),date:new Date().toISOString(),productId:p.id,productName:p.name,code:p.code,type:'Ajuste manual',delta:data.stock-oldStock,previous:oldStock,next:data.stock,ref:'Edición producto',user:role(),observation:'Cambio desde formulario de producto'});} ui.productEditingId=null;} else {const id=uid('pro');DB.products.unshift({id,createdAt:new Date().toISOString(),...data});DB.movements.unshift({id:uid('mov'),date:new Date().toISOString(),productId:id,productName:data.name,code:data.code,type:'Entrada inicial',delta:data.stock,previous:0,next:data.stock,ref:'Nuevo producto',user:role(),observation:'Creación de producto'});} saveDB();alert('Producto guardado.');go('inventory');}
    function editProduct(id){ui.productEditingId=id;go('productNew');}
    function adjustStock(id){const p=productById(id); if(!p)return; const newStock=prompt(`Stock actual de ${p.name}: ${p.stock}\nNuevo stock:`,p.stock); if(newStock===null)return; const n=num(newStock); const old=Number(p.stock); p.stock=n; DB.movements.unshift({id:uid('mov'),date:new Date().toISOString(),productId:p.id,productName:p.name,code:p.code,type:'Ajuste manual',delta:n-old,previous:old,next:n,ref:'Ajuste inventario',user:role(),observation:'Ajuste manual rápido'}); saveDB(); render();}
    function renderStockLow(){const list=activeProducts().filter(p=>Number(p.stock)<=Number(p.minStock));return `<div class="card"><div class="section-title"><div><h2>Stock bajo</h2><p>Productos que necesitan reposición.</p></div><button class="btn btn-primary" onclick="go('productNew')">Ingresar producto</button></div>${inventoryTable(list)}</div>`}
    function renderMovements(){const list=DB.movements||[];return `<div class="card"><div class="section-title"><div><h2>Movimientos de inventario</h2><p>Historial de entradas, salidas y ajustes.</p></div></div>${list.length?`<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th>Cambio</th><th>Antes</th><th>Después</th><th>Referencia</th><th>Usuario</th></tr></thead><tbody>${list.map(m=>{const p=productById(m.productId)||{name:m.productName,code:m.code,image:m.image||''};return `<tr><td>${new Date(m.date).toLocaleString('es-CO')}</td><td>${productCell({...p,name:m.productName||p.name,code:m.code||p.code})}</td><td>${esc(m.type)}</td><td><b>${m.delta>0?'+':''}${m.delta}</b></td><td>${m.previous}</td><td>${m.next}</td><td>${esc(m.ref||'')}</td><td>${esc(m.user||'')}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty">No hay movimientos.</div>`}</div>`}

    function renderRoute(){const date=val('routeDate')||today(); const list=DB.orders.filter(o=>!o.deleted && o.estimatedDelivery===date && !['Cancelado'].includes(o.status)); return `<div class="card"><div class="section-title"><div><h2>Ruta de trabajo</h2><p>Pedidos programados por fecha estimada de entrega.</p></div></div><div class="form-grid"><div class="field"><label>Fecha de ruta</label><input type="date" class="input" id="routeDate" value="${date}" onchange="renderRouteOnly()"></div><div class="field"><label>Resumen</label><div class="notice">${list.length} pedido(s) para esta fecha.</div></div></div></div><div class="grid grid-3" style="margin-top:16px">${list.length?list.map(o=>routeCard(o)).join(''):`<div class="empty">No hay pedidos para esta ruta.</div>`}</div>`}
    function renderRouteOnly(){document.getElementById('view').innerHTML=renderRoute();}
    function routeCard(o){return `<div class="card"><div class="section-title"><div><h2>${o.number}</h2><p>${esc(o.client?.name||'')}</p></div>${statusBadge(o.status)}</div><p><b>Dirección:</b> ${esc(o.client?.address||'')} ${esc(o.client?.city||'')}</p><p><b>Teléfono:</b> ${esc(o.client?.phone||'')}</p><p><b>Total:</b> ${money(o.total)} · <b>Pago:</b> ${esc(o.paymentMethod)}</p><div class="actions" style="margin:8px 0 12px">${o.items.slice(0,4).map(i=>productImage(i,'product-thumb sm')).join('')}<span class="badge gray">${o.items.length} producto(s)</span></div><div class="actions"><button class="btn btn-info btn-sm btn-secondary" onclick="setOrderStatus('${o.id}','En ruta')">En ruta</button><button class="btn btn-success btn-sm" onclick="setOrderStatus('${o.id}','Entregado')">Entregado</button><button class="btn btn-warning btn-sm" onclick="setOrderStatus('${o.id}','Pendiente')">Reprogramar</button></div></div>`}

    function renderSync(){return `<div class="grid grid-2"><div class="card"><div class="section-title"><div><h2>Sincronizar dispositivo</h2><p>Conexión con Firebase y respaldo local del dispositivo.</p></div></div><p>Dispositivo: <span class="device-id">${esc(DB.settings.deviceId)}</span></p><p>Proyecto Firebase: <b>${esc(window.repuestosFirebase?.projectId||'repuestos-bb42c')}</b></p><p>Última sincronización: <b>${DB.settings.lastSync?new Date(DB.settings.lastSync).toLocaleString('es-CO'):'No registrada'}</b></p><div class="notice ${navigator.onLine?'':'warn'}">Estado: ${navigator.onLine?'con internet':'sin conexión'}. ${esc(cloudState.lastMessage||'Firebase inicializando')}${cloudState.lastError?`<br><b>Detalle:</b> ${esc(cloudState.lastError)}`:''}</div><div class="actions" style="margin-top:14px"><button class="btn btn-primary" onclick="syncNow()">Sincronizar ahora</button><button class="btn btn-success" onclick="pullCloudDB()">Descargar Firebase</button><button class="btn btn-warning" onclick="pushCloudDB().then(ok=>{if(ok)alert('Datos subidos a Firebase.');render();})">Subir a Firebase</button><button class="btn btn-outline" onclick="exportBackup()">Exportar respaldo</button><label class="btn btn-secondary">Importar respaldo<input type="file" accept="application/json" onchange="importBackup(event)" style="display:none"></label></div><div class="notice warn" style="margin-top:14px">Recomendación: para que Firebase funcione mejor, abre el archivo desde localhost o desde un hosting con HTTPS. Si lo abres con doble clic desde file://, algunas funciones del navegador pueden limitarse.</div></div><div class="card"><div class="section-title"><div><h2>Datos del sistema</h2><p>Resumen disponible para sincronizar.</p></div></div><div class="summary-box"><div class="summary-row"><span>Productos</span><b>${DB.products.length}</b></div><div class="summary-row"><span>Pedidos</span><b>${DB.orders.length}</b></div><div class="summary-row"><span>Cotizaciones</span><b>${DB.quotes.length}</b></div><div class="summary-row"><span>Devoluciones</span><b>${DB.returns.length}</b></div><div class="summary-row"><span>Movimientos</span><b>${DB.movements.length}</b></div></div><div class="notice" style="margin-top:14px">Cada pedido, producto, cotización, devolución y movimiento de inventario se guarda en Firestore. Las imágenes cargadas desde archivo intentan subirse a Firebase Storage y se guardan como URL.</div></div></div>`}
    async function syncNow(){const ok=await pullCloudDB(false); if(ok){await pushCloudDB(); alert('Sincronización con Firebase realizada.'); render();}}
    function exportBackup(){const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='respaldo_sistema_repuestos_'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
    function importBackup(ev){const file=ev.target.files[0]; if(!file)return; const reader=new FileReader(); reader.onload=()=>{try{const data=JSON.parse(reader.result); if(!data.products||!data.orders){alert('Archivo no válido.');return;} DB=data;saveDB();alert('Respaldo importado.');render();}catch(e){alert('No se pudo importar el archivo.')}}; reader.readAsText(file)}
    function renderDeleteOrders(){const list=DB.orders.filter(o=>o.deleted);return `<div class="card"><div class="section-title"><div><h2>Eliminar pedidos</h2><p>Solo administrador. Los pedidos eliminados quedan como historial y pueden restaurarse.</p></div></div>${isAdmin()?deletedOrdersTable(list):'<div class="notice danger">No tienes permiso para ver esta sección.</div>'}</div>`}
    function deletedOrdersTable(list){if(!list.length)return `<div class="empty">No hay pedidos eliminados.</div>`;return `<div class="table-wrap"><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Total</th><th>Eliminado</th><th>Acciones</th></tr></thead><tbody>${list.map(o=>`<tr><td><b>${o.number}</b></td><td>${esc(o.client?.name||'')}</td><td>${money(o.total)}</td><td>${o.deletedAt?new Date(o.deletedAt).toLocaleString('es-CO'):''}<br><small>${esc(o.deletedBy||'')}</small></td><td><button class="btn btn-success btn-sm" onclick="restoreDeletedOrder('${o.id}')">Restaurar</button></td></tr>`).join('')}</tbody></table></div>`}
    function renderDeleteQuotes(){const list=DB.quotes.filter(q=>q.deleted);return `<div class="card"><div class="section-title"><div><h2>Eliminar cotizaciones</h2><p>Historial de cotizaciones eliminadas.</p></div></div>${isAdmin()?deletedQuotesTable(list):'<div class="notice danger">No tienes permiso para ver esta sección.</div>'}</div>`}
    function deletedQuotesTable(list){if(!list.length)return `<div class="empty">No hay cotizaciones eliminadas.</div>`;return `<div class="table-wrap"><table><thead><tr><th>Cotización</th><th>Cliente</th><th>Total</th><th>Acciones</th></tr></thead><tbody>${list.map(q=>`<tr><td><b>${q.number}</b></td><td>${esc(q.client?.name||'')}</td><td>${money(q.total)}</td><td><button class="btn btn-success btn-sm" onclick="restoreDeletedQuote('${q.id}')">Restaurar</button></td></tr>`).join('')}</tbody></table></div>`}
    function renderUsers(){return `<div class="card"><div class="section-title"><div><h2>Usuarios</h2><p>Registra aquí los usuarios autorizados. El mismo correo también debe existir en Firebase Authentication.</p></div></div><div class="form-grid"><div class="field"><label>Nombre</label><input class="input" id="userName"></div><div class="field"><label>Correo</label><input class="input" id="userEmail"></div><div class="field"><label>Rol</label><select class="select" id="userRole"><option>Admin</option><option>Vendedor</option><option>Bodega</option><option>Ruta</option></select></div><div class="field" style="justify-content:end"><button class="btn btn-primary" onclick="addUser()">Agregar usuario</button></div></div><div style="margin-top:16px">${usersTable()}</div></div>`}
    function usersTable(){return `<div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th></tr></thead><tbody>${DB.users.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td>${u.active?'<span class="badge ok">Activo</span>':'<span class="badge gray">Inactivo</span>'}</td></tr>`).join('')}</tbody></table></div>`}
    function addUser(){if(!isAdmin()){alert('Solo administrador.');return;} if(!val('userName')||!val('userEmail')){alert('Nombre y correo son obligatorios.');return;} DB.users.unshift({id:uid('usr'),name:val('userName'),email:val('userEmail'),role:val('userRole'),active:true});saveDB();render();}


    function findAppUser(email, uid){
      const e=String(email||'').trim().toLowerCase();
      return (DB.users||[]).find(u=>{
        const userEmail=String(u.email||'').trim().toLowerCase();
        return u.active!==false && ((u.uid && uid && String(u.uid)===String(uid)) || (e && userEmail===e));
      }) || null;
    }
    function showLogin(message='', type='error'){
      const login=document.getElementById('loginScreen');
      const appEl=document.getElementById('app');
      if(login) login.classList.remove('hidden');
      if(appEl) appEl.classList.add('auth-hidden');
      const msg=document.getElementById('loginMessage');
      if(msg){msg.textContent=message||''; msg.classList.toggle('ok', type==='ok');}
      const btn=document.getElementById('loginButton');
      if(btn){btn.disabled=false;btn.textContent='Ingresar al sistema';}
    }
    function showLoginLoading(message='Validando acceso...'){
      const login=document.getElementById('loginScreen');
      const appEl=document.getElementById('app');
      if(login) login.classList.remove('hidden');
      if(appEl) appEl.classList.add('auth-hidden');
      const msg=document.getElementById('loginMessage');
      if(msg){msg.textContent=message;msg.classList.add('ok');}
      const btn=document.getElementById('loginButton');
      if(btn){btn.disabled=true;btn.textContent='Validando...';}
    }
    function showApp(){
      const login=document.getElementById('loginScreen');
      const appEl=document.getElementById('app');
      if(login) login.classList.add('hidden');
      if(appEl) appEl.classList.remove('auth-hidden');
      const btn=document.getElementById('loginButton');
      if(btn){btn.disabled=false;btn.textContent='Ingresar al sistema';}
    }
    function toggleLoginPassword(){
      const input = document.getElementById('loginPassword');
      const btn = document.getElementById('loginPasswordToggle');
      if(!input || !btn) return;
      const visible = input.type === 'text';
      input.type = visible ? 'password' : 'text';
      btn.innerHTML = visible ? '👁️ Ver' : '🙈 Ocultar';
      btn.setAttribute('aria-label', visible ? 'Mostrar contraseña' : 'Ocultar contraseña');
      input.focus();
    }
    window.toggleLoginPassword = toggleLoginPassword;

    async function loginSubmit(event){
      event.preventDefault();
      const email=val('loginEmail');
      const password=val('loginPassword');
      if(!email || !password){showLogin('Usuario incorrecto');return;}
      showLoginLoading('Validando credenciales...');
      const ready=await waitForFirebase(7000);
      if(!ready || !window.repuestosFirebase?.login){showLogin('Usuario incorrecto');return;}
      try{
        await window.repuestosFirebase.login(email,password);
      }catch(e){
        console.warn('Login rechazado', e);
        showLogin('Usuario incorrecto');
      }
    }
    async function handleAuthChanged(user){
      if(!user){
        authState.checking=false;authState.validating=false;authState.authenticated=false;authState.user=null;authState.appUser=null;
        const msg=authState.lastAuthError; authState.lastAuthError='';
        showLogin(msg||'');
        return;
      }
      authState.checking=false;authState.validating=true;authState.authenticated=false;authState.user=user;
      showLoginLoading('Validando usuario en la base...');
      const ready=await waitForFirebase(7000);
      if(!ready){
        authState.lastAuthError='Usuario incorrecto';
        await window.repuestosFirebase?.logout?.().catch(()=>{});
        showLogin('Usuario incorrecto');
        return;
      }
      const pulledOk=await pullCloudDB(true);
      if(!pulledOk){
        authState.lastAuthError='Usuario no registrado';
        await window.repuestosFirebase?.logout?.().catch(()=>{});
        showLogin('Usuario no registrado');
        return;
      }
      const appUser=findAppUser(user.email,user.uid);
      if(!appUser){
        authState.lastAuthError='Usuario no registrado';
        await window.repuestosFirebase?.logout?.().catch(()=>{});
        showLogin('Usuario no registrado');
        return;
      }
      DB.currentRole=appUser.role||'Vendedor';
      DB.session={uid:user.uid,email:user.email,name:appUser.name||user.displayName||user.email,role:DB.currentRole,loginAt:new Date().toISOString()};
      localSaveOnly();
      authState.appUser=appUser;authState.validating=false;authState.authenticated=true;
      setCloudState('Sesión iniciada');
      showApp();
      render();
    }
    async function logout(){
      authState.lastAuthError='';
      await window.repuestosFirebase?.logout?.().catch(()=>{});
      authState.authenticated=false;authState.user=null;authState.appUser=null;
      showLogin('Sesión cerrada','ok');
    }
    window.addEventListener('repuestos-auth-changed',ev=>handleAuthChanged(ev.detail?.user||null));

    document.addEventListener('DOMContentLoaded',()=>{});
  </script>
</body>
</html>
